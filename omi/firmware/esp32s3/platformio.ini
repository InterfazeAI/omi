; PlatformIO Project Configuration File
;
; Omi audio pendant firmware for the Seeed XIAO ESP32-S3 Sense.
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi
; CONFIG_* symbols are baked into the precompiled ESP-IDF that ships with the
; Arduino framework, so overriding them here only produces redefinition warnings.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=32768
lib_deps =
    https://github.com/pschatzmann/arduino-libopus.git

[env:seeed_xiao_esp32s3]
upload_speed = 921600
upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1

; Same build at a conservative upload speed, for flaky USB cables/hubs.
[env:seeed_xiao_esp32s3_slow]
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5

; Release build consumed by scripts/build_uf2.py --env uf2_release.
[env:uf2_release]
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
