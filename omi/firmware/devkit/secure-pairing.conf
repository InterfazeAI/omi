# Requires a paired, encrypted link for audio, storage, the clock and the DFU control point.
#
# NOT IN THE DEFAULT BUILD YET, because switching it on forces every existing client to re-pair;
# it should land together with the app-side change, not before it.
#
# Without SMP every characteristic is readable by anyone who walks up, which for a continuously
# recording device means the whole SD card, plus DELETE/NUKE and a one-byte remote reboot into
# the bootloader.
#
# The board has no display or keypad, so pairing is necessarily "Just Works" and carries no MITM
# protection -- encryption alone would still let an attacker simply pair. What closes that is the
# single bond slot with no eviction: once one device is bonded there is nowhere to put a second,
# and further pairing attempts are refused. First device to pair owns the board.
#
# Consequence: bonds live in the `storage` flash partition, outside the app region, so they
# survive a normal UF2 reflash and there is no button to hold. Re-pairing a different phone needs
# the recovery image from omi_build_unbond.sh.
# LE Secure Connections needs a P-256 ECDH computation before pairing can finish, and by default
# nrfxlib runs it on a dedicated thread at K_PRIO_PREEMPT(10). The codec thread on this device sits
# at K_PRIO_PREEMPT(4) and records continuously, so the ECDH thread is starved (DEBUGGING.md trap 5
# measured multi-second scheduling gaps at priority 7 alone). The computation never finishes inside
# the 30 s SMP window, and pairing dies in smp_timeout() reporting the maximally unhelpful
# "unspecified" -- which looks exactly like a broken host, not a busy CPU.
#
# Running it in the MPSL workqueue puts it above the codec instead of below it. The documented cost
# is delaying MPSL work, which is acceptable for a one-off computation that only happens at pairing.
CONFIG_BT_CTLR_ECDH_IN_MPSL_WORK=y

CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n

# Bonds must outlive a reboot, or the paired phone is locked out by the slot its own stale bond
# would have occupied. NVS on the `storage` partition backs them.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
