# SD bring-up fragment: offline storage ENABLED, button and speaker still off.
#
# Counterpart to no-sd-button-speaker.conf, for use once the microSD board is
# wired. Layer it over prj_xiao_ble_sense_devkitv2-adafruit.conf together with
# debug-usb-log.conf to read the mount result.
#
# mount_sd_card() runs before transport_start(), so its log lines are emitted
# before the pusher thread exists and begins flooding the log buffer. A failed
# mount makes main() return early (main.c:228-232), so the device will not
# advertise at all - absence of BLE is itself the failure signal here.
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y

# D4/D5 float on this build and generate spurious press/release events, which
# reach turnoff_all() -> SYSTEMOFF on a long press.
CONFIG_OMI_ENABLE_BUTTON=n

# No speaker fitted.
CONFIG_OMI_ENABLE_SPEAKER=n
