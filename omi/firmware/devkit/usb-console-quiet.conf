# Audio-capture fragment: USB CDC console, but the LOG subsystem silenced.
#
# Use this INSTEAD of debug-usb-log.conf once boot has been diagnosed.
#
# The pusher thread in transport.c is a free-running loop throttled only by
# k_yield(), and it calls read_from_tx_queue() every iteration. That logs
# "Failed to read from ring buffer" whenever the queue is momentarily empty,
# which is nearly always, since codec frames only arrive every 10 ms. Shipped
# firmware never pays for this because prj_xiao_ble_sense_devkitv2-adafruit.conf
# leaves CONFIG_LOG off. With logging on, the loop floods the log buffer, and
# the resulting overflow drops the transport init messages and starves
# advertising, so the device never becomes visible over BLE.
#
# Level 0 compiles the LOG_* calls out of every module (they all register with
# CONFIG_LOG_DEFAULT_LEVEL), restoring production timing while keeping the CDC
# port and raw printk output - which is what prints the boot banner and the
# "Reset by <cause>" line.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_BOOT_BANNER=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="Omi DK2 Quiet"

# Logging present but silent. printk bypasses the log system so the banner and
# reset cause still reach the console at full speed.
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_BACKEND_UART=y
