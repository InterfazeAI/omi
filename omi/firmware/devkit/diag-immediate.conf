# Diagnostic only: synchronous logging so a fault dump reaches the USB console before reset.
# Deferred logging loses queued lines when the CPU faults, which hides where a boot loop starts.
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXCEPTION_DEBUG=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
