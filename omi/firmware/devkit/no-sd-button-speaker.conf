# Bring-up fragment for a DK2 built without a speaker, without a momentary
# button (D4/D5 pads unpopulated), and with a non-responding SD card.
#
# Offline storage is off so main() reaches transport_start() instead of
# returning at the failed mount. Live BLE streaming still works; only
# on-device recording is lost.
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n

# D4/D5 float and generate spurious press/release events, which reach
# turnoff_all() -> SYSTEMOFF on a long press.
CONFIG_OMI_ENABLE_BUTTON=n

# No speaker fitted. Haptic stays enabled: its driver lives in speaker.c,
# which is compiled unconditionally by CMakeLists.txt.
CONFIG_OMI_ENABLE_SPEAKER=n
