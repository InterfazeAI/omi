# Diagnostic-only fragment: routes console + logs over USB CDC ACM.
# Layered on top of prj_xiao_ble_sense_devkitv2-adafruit.conf via EXTRA_CONF_FILE
# so the rest of the build stays identical to the shipped firmware.

# Console
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_BOOT_BANNER=y

# USB device stack providing the CDC ACM console
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="Omi DK2 Debug"

# Logging. Deferred, not immediate: with offline storage off and no BLE
# subscriber the audio pipeline logs an error per 20 ms frame, and immediate
# mode writes each one synchronously from the calling thread. Once the 1 KB
# CDC ring fills with no host draining it, uart_poll_out never returns and the
# whole application wedges while the radio keeps advertising on its own.
# Deferred mode hands formatting to a low-priority thread that drops on
# overflow, so the log path can never stall the audio or Bluetooth threads.
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
