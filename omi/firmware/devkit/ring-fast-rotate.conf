# Test overlay: makes the recording ring small enough to watch rotate and evict in minutes
# rather than days. 450560 bytes is the minimum aligned segment, ~3 min of audio at 20 kbps
# CELT, so a 3-segment ring turns over in ~9 min. Never build a release image with this.
CONFIG_OMI_RING_SEGMENT_BYTES=450560
CONFIG_OMI_RING_SEGMENT_COUNT=3

# Rotation and eviction only announce themselves through LOG_INF/LOG_ERR, and the base config
# sets CONFIG_CONSOLE=n, so this fragment is useless on its own: build it together with
# debug-usb-log.conf (omi_build_ringtest.sh does) or the test is unobservable.
