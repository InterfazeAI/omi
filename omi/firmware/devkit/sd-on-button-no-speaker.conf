# SD bring-up fragment for a board with the power button fitted but no speaker.
#
# Counterpart to sd-on-no-button-speaker.conf, for hardware where the battery switch has been
# replaced by a momentary button. Layer it over prj_xiao_ble_sense_devkitv2-adafruit.conf.
#
# Wiring: the button pulls D5 (P0.05) down, either to GND or to D4 (P0.04) -- button_init() holds
# D5 high with the internal pull-up and drives D4 low, so both work and neither needs a resistor.
# What does not work is D4 driven high, which is what the firmware used to do: D5 already idles
# high, so the button would short high to high and no edge would ever reach the interrupt.
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y

# Safe to enable only because D5 is now pulled up. Previously it was configured as a bare input,
# and an unconnected pin drifts low often enough to look like a held button -- three seconds of
# which is the shutdown gesture, so the board switched itself off at random. That float, not the
# button logic, is why this was set to n on this board.
CONFIG_OMI_ENABLE_BUTTON=y

# Neither is fitted. Without these, the shutdown path still drives a speaker enable and a haptic
# motor that are not there; harmless, but it wastes a pin and 50 ms on the way to SYSTEMOFF.
CONFIG_OMI_ENABLE_SPEAKER=n
CONFIG_OMI_ENABLE_HAPTIC=n
