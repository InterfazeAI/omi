# Recovery fragment, never production. Layer it AFTER secure-pairing.conf.
#
# CONFIG_OMI_ERASE_BONDS_ON_BOOT depends on BT_SETTINGS, which secure-pairing.conf provides. On its
# own this fragment is silently inert: Kconfig cannot select the symbol, the build succeeds, and the
# image boots erasing nothing -- a recovery path that quietly does not recover. omi_build_unbond.sh
# has the fragment order right.
#
# Prefer the over-the-air release. The paired device can hand the board over itself with
# `pairing.py --release`, which also wipes the recordings so the next owner cannot read them. This
# image exists for when that is impossible -- the bonded phone is lost, broken or wiped -- and it
# clears the bond only, leaving the audio on the card.
#
# There is one bond slot and no eviction, so the first device to pair owns the board. Bonds live
# in the `storage` flash partition, which sits outside the app region and therefore survives a
# normal UF2 reflash -- and this build has no button to hold at boot. Flash this image once, let
# it boot, then flash the normal image back and pair the device you actually want.
CONFIG_OMI_ERASE_BONDS_ON_BOOT=y
